<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Tube Glass Gradient -->
    <linearGradient id="tubeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ball 1: Violet/Magenta -->
    <radialGradient id="ballTop" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>

    <!-- Ball 2: Cyan/Sapphire -->
    <radialGradient id="ballMid" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Ball 3: Amber/Gold -->
    <radialGradient id="ballBot" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Drop Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Rounded Squircle for Android Icon) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Outer Ambient Glow Behind Tube -->
  <circle cx="256" cy="270" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />

  <!-- Glass Tube Shadow -->
  <rect x="180" y="90" width="152" height="340" rx="76" fill="#000000" opacity="0.35" filter="url(#glow)" />

  <!-- Glass Tube Body -->
  <rect x="180" y="85" width="152" height="340" rx="76" fill="url(#tubeGlass)" stroke="#67e8f9" stroke-width="4" stroke-opacity="0.5" />

  <!-- Tube Rim Lip at Top -->
  <ellipse cx="256" cy="95" rx="80" ry="14" fill="#ffffff" fill-opacity="0.25" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />

  <!-- Ball 3 (Bottom) -->
  <circle cx="256" cy="355" r="54" fill="url(#ballBot)" />
  <ellipse cx="242" cy="335" rx="16" ry="9" fill="#ffffff" fill-opacity="0.6" transform="rotate(-25 242 335)" />

  <!-- Ball 2 (Middle) -->
  <circle cx="256" cy="255" r="54" fill="url(#ballMid)" />
  <ellipse cx="242" cy="235" rx="16" ry="9" fill="#ffffff" fill-opacity="0.6" transform="rotate(-25 242 235)" />

  <!-- Ball 1 (Floating Top / Selected) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="135" r="54" fill="url(#ballTop)" />
    <ellipse cx="242" cy="115" rx="16" ry="9" fill="#ffffff" fill-opacity="0.75" transform="rotate(-25 242 115)" />
  </g>

  <!-- Glass Specular Reflection Streak -->
  <path d="M 194 130 Q 190 260 196 380" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" fill="none" />
  
  <!-- Subtle sparkles -->
  <polygon points="340,110 345,125 360,130 345,135 340,150 335,135 320,130 335,125" fill="#fde047" opacity="0.85" />
  <polygon points="140,290 143,300 153,303 143,306 140,316 137,306 127,303 137,300" fill="#38bdf8" opacity="0.8" />
</svg>
